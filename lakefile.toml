name = "wp_supercongruence"
version = "0.1.0"
defaultTargets = ["WPSupercongruence"]
fixedToolchain = true

# Declare the pinned widget dependency directly so its public JS assets can
# be built locally; mathlib's downstream errorOnBuild option is not needed.
[[require]]
name = "proofwidgets"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/ProofWidgets4"
rev = "4be2e3d5087eeb272cf5a8853b8f9dd025ef5957"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

